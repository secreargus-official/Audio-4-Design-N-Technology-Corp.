<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | Profile</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      text-align: center;
    }
    img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 5px solid white;
      margin-bottom: 20px;
    }
    h1 { margin: 10px 0; }
    h2 { color: #ffd700; }
    .social-links a {
      color: white;
      font-size: 1.5rem;
      margin: 0 15px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://via.placeholder.com/180" alt="Your Photo">
    <h1>Your Full Name</h1>
    <h2>Web Developer | Designer | Creator</h2>
    <p>I'm a passionate developer who loves building beautiful digital experiences.</p>
    
    <div class="social-links">
      <a href="https://github.com/yourusername" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
      <a href="https://twitter.com/yourhandle" target="_blank">Twitter</a>
    </div>
  </div>
</body>
</html>
